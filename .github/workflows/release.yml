name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 8
      - name: Install root deps
        run: npm install
      - name: Install dsh-web-ui deps
        working-directory: resources/dsh-web-ui
        run: pnpm install --ignore-scripts
      - name: Build NSIS installer
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: release/DeepSeek-Harness-Setup-*.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 8
      - name: Install root deps
        run: npm install
      - name: Install dsh-web-ui deps
        working-directory: resources/dsh-web-ui
        run: pnpm install --ignore-scripts
      - name: Build DMG
        run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: release/*.dmg
